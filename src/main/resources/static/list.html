<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>学習タスク一覧</title>
</head>
<body>
    <h1>タスク一覧</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>タイトル</th>
                <th>優先度</th>
                <th>期限</th>
                <th>制作日</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.id}"></td>
                <td th:text="${task.title}"></td>
                <td th:text="${task.priority}"></td>
                <td th:text="${task.due_date}"></td>
                <td th:text="${task.created_at}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
