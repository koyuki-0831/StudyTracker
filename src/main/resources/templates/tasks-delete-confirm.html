<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク削除確認</title>
<style>
body {
    min-height: 100%;
    margin: 0;
    font-family: sans-serif;
    background-color: #fcfcf8;
    background-image: 
        radial-gradient(circle, #d8d8d8 0.8px, transparent 1px),
        linear-gradient(to bottom, transparent 13px, #e5e5e5 14px);
    background-size: 14px 14px, 100% 14px;
    background-position: 0 7px, 0 0;
}

main {
    padding: 20px 40px 40px;
    text-align: center;
}

.page-title {
    position: relative;
    display: inline-block;
    font-size: 48px;
    color: #001e43;
    margin: 0 0 32px;
    z-index: 1;
}

.page-title::after {
    content: "";
    position: absolute;
    left: -8px;
    bottom: 8px;
    width: calc(100% + 16px);
    height: 22px;
    background-color: rgba(255, 255, 0, 0.45);
    z-index: -1;
    transform: rotate(-1deg);
}

.warning-message {
    color: #d93636;
    font-size: 20px;
    font-weight: bold;
    margin: 24px;
}

.confirm-card {
    width: 720px;
    margin: 0 auto 28px;
    padding: 28px 36px;
    background-color: rgba(225, 255, 255, 0.92);
    border-radius: 12px;
    box-shadow: 4px 6px 10px rgba(255, 255, 0, 0.15);
    text-align: left;
}

.confirm-row {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 20px;
    padding: 14px 0;
    border-bottom: 1px solid #ddd;
}

.confirm-label {
    font-weight: bold;
    color: #001e43;
}

.confirm-value {
    color: #333;
    word-break: break-word;
    white-space: pre-wrap;
}

.error-message {
    color: #d93636;
    font-weight: bold;
    min-height: 24px;
}

.button-area {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 32px;
}

.menu-button {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 220px;
    min-height: 50px;
    padding: 12px 20px;
    background-color: #a59aca;
    color: #001e43;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 4px 6px 8px rgba(0, 0, 0, 0.18);
}

.delete-button {
    background-color: #b8d8ff;
}
</style>
</head>
<body>
<div th:replace="~{header :: header}"></div>
<main>
    <h1 class="page-title">タスク削除確認</h1>
    <p class="warning-message">
        このタスクを削除します。よろしいですか？
    </p>

    <div class="confirm-card">
        <div class="confirm-row">
            <div class="confirm-label">ID:</div>
            <div class="confirm-value" id="confirmId"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">ユーザーID:</div>
            <div class="confirm-value" id="confirmUserId"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">タイトル:</div>
            <div class="confirm-value" id="confirmTitle"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">学習詳細:</div>
            <div class="confirm-value" id="confirmDescription"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">進行度:</div>
            <div class="confirm-value" id="confirmStatus"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">優先度:</div>
            <div class="confirm-value" id="confirmPriority"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">期限:</div>
            <div class="confirm-value" id="confirmDueDate"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">公開/非公開:</div>
            <div class="confirm-value" id="confirmVisibility"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">更新日:</div>
            <div class="confirm-value" id="confirmUpdateDate"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">作成日:</div>
            <div class="confirm-value" id="confirmCreatedAt"></div>
        </div>
    </div>

    <p id="errorMessage" class="error-message"></p>

    <div class="button-area">
        <button type="button" id="deleteButton" class="menu-button delete-button">
            削除する
        </button>

        <a href="#" id="backButton" class="menu-button">
            戻る
        </a>
    </div>
</main>

<script>
const selectedTask =
    JSON.parse(sessionStorage.getItem("selectedTask"));

const backPage = 
    sessionStorage.getItem("tasksBackPage") || "/tasks-update-form";

if(!selectedTask) {
    alert("削除対象のタスクがありません。検索画面に戻ります。");
    window.location.href = "/tasks-search?action=delete";
}

document.getElementById("confirmId").textContent =
    selectedTask.id ?? "-";

document.getElementById("confirmUserId").textContent =
    selectedTask.userId ?? selectedTask.user_id ?? "-";

document.getElementById("confirmTitle").textContent =
    selectedTask.title ?? "-";

document .getElementById("confirmDescription").textContent =
    selectedTask.description || "-";

document.getElementById("confirmStatus").textContent =
    selectedTask.status ?? "-";

document.getElementById("confirmPriority").textContent =
    selectedTask.priority ?? "-";

document.getElementById("confirmDueDate").textContent =
    formatData(selectedTask.due_date ?? selectedTask.dueDate);

document.getElementById("confirmVisibility").textContent =
    formatVisibility(selectedTask.visibility);

document.getElementById("confirmUpdateDate").textContent =
    formatData(selectedTask.update_date ?? selectedTask.updateDate);

document.getElementById("confirmCreatedAt").textContent =
    formatData(selectedTask.created_at ?? selectedTask.createdAt);

document.getElementById("deleteButton")
    .addEventListener("click", function() {

        fetch(`/tasks/${selectedTask.userId}/${selectedTask.id}`, {
            method: "DELETE"
        })
        .then(response => {
            if(!response.ok){
                throw new Error("削除に失敗しました");
            }

            alert("削除しました");

            sessionStorage.removeItem("selectedTask");

            window.location.href ="/tasks-page";
        })
        .catch(error => {
            document.getElementById("errorMessage").textContent =
                error.message;
            
            console.error(error);
        });   
    });

document.getElementById("backButton")
    .addEventListener("click", function(event) {

        event.preventDefault();

        window.location.href =
            sessionStorage.getItem("tasksBackPage")
            || "/tasks-list";
});

function formatData(value) {
    if(!value) {
        return "-";
    }
    return value.substring(0, 10);
}

function formatVisibility(value) {
    if(value === "PUBLIC") {
        return "公開";
    }
    if(value === "PRIVATE") {
        return "非公開";
    }
    return value ?? "-";
}
</script>
</body>
</html>
