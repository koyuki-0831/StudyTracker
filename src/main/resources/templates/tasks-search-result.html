<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク検索結果</title>

<style>
body {
    min-height: 100%;
    margin: 0;
    font-family: sans-serif;

    background-color: #fcfcf8;

    background-image:
        radial-gradient(
            circle,
            #d8d8d8 0.8px,
            transparent 1px
        ),
        linear-gradient(
            to bottom,
            transparent 13px,
            #e5e5e5 14px
        );

    background-size:
        14px 14px,
        100% 14px;

    background-position:
        0 7px,
        0 0;
}

main {
    padding: 20px 40px 40px;
    text-align: center;
}

.page-title {
    position: relative;
    display: inline-block;

    font-size: 48px;
    color: #001e43;

    margin: 0 0 32px;

    z-index: 1;
}

.page-title::after {
    content: "";

    position: absolute;

    left: -8px;
    bottom: 8px;

    width: calc(100% + 16px);
    height: 22px;

    background-color: rgba(225, 225, 0, 0.45);

    z-index: -1;

    transform: rotate(-1deg);
}

.result-area {
    width: 95%;
    margin: 0 auto;

    overflow-x: auto;

    border-radius: 12px;
}

.result-message {
    font-size: 18px;
    font-weight: bold;

    color: #001e43;

    margin-bottom: 20px;
}

.error-message {
    color: #d93636;
    font-weight: bold;

    min-height: 24px;
}

.task-table {
    min-width: 1300px;

    width: max-content;

    border-collapse: collapse;

    background-color: rgba(225, 225, 225, 0.92);

    box-shadow:
        4px 6px 10px rgba(0, 0, 0, 0.12);
}

.task-table th,
.task-table td {
    padding: 14px 18px;

    border-bottom: 1px solid #ddd;

    text-align: center;

    color: #001e43;

    white-space: nowrap;

    vertical-align: middle;
}

.task-table th {
    background-color: #a59aca;

    color: #001e43;

    font-size: 18px;
    font-weight: bold;
}

.task-table tr:hover {
    background-color: #f3f0ff;
}

.task-table td:nth-child(3),
.task-table th:nth-child(3) {
    min-width: 220px;
}

.task-table td:nth-child(4),
.task-table th:nth-child(4) {
    min-width: 260px;

    white-space: normal;

    word-break: break-word;
}

.task-table td:last-child,
.task-table th:last-child {

    position: sticky;
    right: 0;

    min-width: 140px;
    width: 140px;

    padding: 8px;

    text-align: center;

    background-color: #ece7f8;

    border-left: 2px solid #d7cfee;

    z-index: 100;

    overflow: hidden;
}

.task-table th:last-child {
    background-color: #a59aca;
    z-index: 101;
}

.task-table tr:hover td:last-child {
    background-color: #f3f0ff;
}

.action-button {
    display: inline-flex;

    justify-content: center;
    align-items: center;

    width: 96px;
    height: 40px;

    border: none;
    border-radius: 10px;

    font-size: 15px;
    font-weight: bold;

    color: #001e43;

    cursor: pointer;

    position: relative;

    z-index: 102;
}

.action-button.update {
    background-color: #f4b6b6;
}

.action-button.delete {
    background-color: #b8d8ff;
}

.button-area {
    display: flex;

    justify-content: center;

    gap: 24px;

    margin-top: 32px;
}

.menu-button {
    display: flex;

    justify-content: center;
    align-items: center;

    width: 220px;
    min-height: 50px;

    padding: 12px 20px;

    background-color: #a59aca;

    color: #001e43;

    font-size: 20px;
    font-weight: bold;

    text-decoration: none;

    border: none;
    border-radius: 4px;

    cursor: pointer;

    box-shadow:
        4px 6px 8px rgba(0, 0, 0, 0.18);
}
</style>
</head>

<body>
<div th:replace= "~{header :: header}"></div>

<main>
    <h1 class="page-title" id="pageTitle">タスク検索結果</h1>

    <p id="resultMessage" class="result-message"></p>
    <p id="errorMessage" class="error-message"></p>

    <div class="result-area">
        <table class="task-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ユーザーID</th>
                    <th>タイトル</th>
                    <th>学習詳細</th>
                    <th>進行度</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>公開/非公開</th>
                    <th>更新日</th>
                    <th>作成日</th>
                    <th id="actionHeader">操作</th>
                </tr>    
            </thead>

            <tbody id="taskTableBody">
            </tbody>
        </table>
    </div>

    <div class="button-area">
        <a href="#" id="backButton" class="menu-button">
            検索へ戻る
        </a>
    </div>
</main>
</body>
<script>
const userId = "A2";

const condition = 
    JSON.parse(sessionStorage.getItem("taskSearchCondition"));

if(!condition) {
    alert("検索条件がありません。検索画面へ戻ります。");
    window.location.href = "/tasks-search";
}

const action = condition.action;

const pageTitle = document.getElementById("pageTitle");
const resultMessage = document.getElementById("resultMessage");
const errorMessage = document.getElementById("errorMessage");
const tbody = document.getElementById("taskTableBody");
const backPage = sessionStorage.getItem("tasksBackPage") || "/tasks-update-form";
const actionHeader = document.getElementById("actionHeader");

if(action === "delete") {
    pageTitle.textContent = "削除するタスクを選択";
    resultMessage.textContent = "削除したいタスクを選択してください。"
    actionHeader.textContent = "削除"
}else {
    pageTitle.textContent = "更新するタスクを選択"
    resultMessage.textContent = "更新したいタスクを選択してください。";
    actionHeader.textContent = "更新";
}

const params = new URLSearchParams();

params.append("userId", userId);
params.append("mode", "MY");
params.append("page", "0");
params.append("size", "20");
params.append("sortBy", "id");
params.append("direction", "desc");

if(condition.keyword && condition.keyword.trim() !== "") {
    params.append("keyword", condition.keyword);
}

if(condition.priority && condition.priority !== "") {
    params.append("priority", condition.priority);
}

if(condition.status && condition.status !== "") {
    params.append("status", condition.status);
}

fetch(`/tasks?${params.toString()}`)
    .then(response => {
        if(!response.ok) {
            throw new Error("タスク検索に失敗しました");
        }
        return response.json();
    })
    .then(data => {
        tbody.innerHTML = "";
        
        if(!data.content || data.content.length === 0) {
            resultMessage.textContent = "該当するタスクがありません。";
            return;
        }

    data.content.forEach(task => {
        const tr = document.createElement("tr");

        const buttonLable =
            action === "delete" ? "削除" : "更新";

        const buttonClass =
            action === "delete" ? "delete" : "update";
        
            tr.innerHTML = `
                <td>${task.id}</td>
                <td>${task.userId}</td>
                <td>${task.title}</td>
                <td>${task.description ?? "-"}</td>
                <td>${task.status ?? "-"}</td>
                <td>${task.priority ?? "-"}</td>
                <td>${formatDate(task.due_date)}</td>
                <td>${formatVisibility(task.visibility)}</td>
                <td>${formatDateTime(task.update_date)}</td>
                <td>${formatDateTime(task.created_at)}</td>
                <td><button type="button" class="action-button ${buttonClass}">
                        ${buttonLable}
                    </button>
                </td>
            `;

        const actionButton = tr.querySelector(".action-button");

        const backButton = document.getElementById("backButton");
        backButton.addEventListener("click", function(event) {
            event.preventDefault();

            window.location.href =
                `/tasks-search?action=${action}`;
        });

        actionButton.addEventListener("click", function() {
            sessionStorage.setItem(
                "selectedTask",
                JSON.stringify(task)
            );

            if(action === "delete") {
                sessionStorage.setItem(
                    "tasksBackPage",
                    "/tasks-search-result"
                );

                window.location.href =
                    `/tasks-delete-confirm?id=${task.id}`;

                } else {
                    sessionStorage.setItem(
                        "tasksBackPage",
                        "/tasks-search-result"
                    );

                    window.location.href =
                        `/tasks-update-form?id=${task.id}`;
                }
        });

        tbody.appendChild(tr);
    });
    })
    .catch(error => {
        errorMessage.textContent = error.message;
        console.error(error);
    });

function formatDate(value) {
    if(!value) {
        return "-";
    }
    return value.substring(0, 10);
}

function formatVisibility(value) {
    if(value === "PUBLIC") {
        return "公開";
    }

    if(value === "PRIVATE") {
        return "非公開"
    }

    return value ?? "-";
}

function formatDateTime(value) {
    if(!value) {
        return "-";
    }
    return value.substring(0, 10);
}
</script>
</html>
