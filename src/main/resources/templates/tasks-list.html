<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>学習タスク一覧</title>
    </head>
    <style>
      
    body {
		min-height: 100%;
        margin: 0;
        font-family: sans-serif;

        background-color: #fcfcf8;

        background-image: 

            /* ドット */
			radial-gradient(
				circle,
			   	#d8d8d8 0.8px,
			 	transparent 1px
			),

            /* 横罫線 */
            linear-gradient(
                to bottom,
                transparent 13px,
                #e5e5e5 14px
            );

            
        /* ドット間隔 / 行間 */
        background-size: 
            14px 14px,
            100% 14px;

        background-position: 
            0 7px,
            0 0;

        transition: transform 0.5s ease, opacity 0.5s ease;
        transform-origin: left center;
    }

    body.page-turn {
        transform: rotateY(-12deg);
        opacity: 0;
    }

    main {
        padding: 20px 40px 40px;
        text-align: center;
    }

    .page-title {
        position: relative;
        display: inline-block;

        font-size: 48px;
        color: #001e43;

        margin-bottom: 50px;

        margin: 0 0 24px;

        z-index: 1;
    }

    .page-title::after {
        content: "";

        position: absolute;

        left: -8px;
        bottom: 8px;

        width: calc(100% + 16px);
        height: 22px;

        background-color: rgba(255, 255, 0, 0.45);

        z-index: -1;

        transform: rotate(-1deg);

    }

    .button-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
    }
    

    .menu-button {
        display: flex;
        justify-content: center;
        align-items: center;

        width: 240px ;
        min-height: 50px ;
        padding: 16px 20px ;
        margin: 20px;

        background-color: #a59aca;
        color: #001e43;

        font-size: 22px;
        font-weight: bold;

        text-decoration: none;
        text-align: center;

        border-radius: 4px;
        box-shadow: 
            4px 6px 8px rgba(0, 0, 0, 0.18);

        transform: rotate(-2deg);

        position: relative;
        overflow: hidden;
    }

    .menu-button:hover {
        transform: rotate(0deg) translateY(-6px);
        box-shadow: 
            6px 10px 14px rgba(0, 0, 0, 0.22);
    }

    .menu-button::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;

        width: 28px;
        height: 28px;

        background: linear-gradient(
            135deg,
            rgba(0, 0, 0, 0.12),
            rgba(255, 255, 255, 0.5)
        );
    }
    </style>
    <body>
        <div th:replace="~{header :: header}"></div>

        <main>
            <h1 class="page-title">学習タスク一覧</h1>

            <table class="task-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ユーザーID</th>
                        <th>タイトル</th>
                        <th>学習詳細</th>
                        <th>進行度</th>
                        <th>優先度</th>
                        <th>期限</th>
                        <th>公開/非公開</th>
                        <th>更新日</th>
                        <th>作成日</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">

                </tbody>
            </table>

            <a th:href="@{/tasks-page}" class="menu-button">
                戻る
            </a>


        </main>
    </body>
    <script>
        document.querySelectorAll(".menu-button").forEach(button => {
            button.addEventListener("click", function(event) {
                event.preventDefault();
    
                const url = this.getAttribute("href");
    
                document.body.classList.add("page-turn");
    
                setTimeout(() => {
                    window.location.href = url;
                }, 500);
            });
        });

        const userId = "A2";

        fetch(`/tasks?userId=ALL`)
            .then(response => {
                console.log("status", response.status);
                return response.json();
            })
            .then(date => {
                console.log("取得データ：", date);
            
                const today = document.getElementById("taskTableBody");
                console.log("tbody:", tbody);

                if(!tbody) {
                    alert("taskTableBodyが見つかりませんでした");
                    return;
                }

                tbody.innerHTML = "";

                date.content.forEach(task => {

                        const tr = document.createElement("tr");
                        
                        tr.innerHTML =`
                            <td>${task.id}</td>
                            <td>${task.userId}</td>
                            <td>${task.title}</td>
                            <td>${task.description ?? "-"}</td>
                            <td>${task.status ?? "-"}</td>
                            <td>${task.priority ?? "-"}</td>
                            <td>${task.due_date ?? "-"}</td>
                            <td>${task.visibility ?? "-"}</td>
                            <td>${task.update_date ?? "-"}</td>
                            <td>${task.created_at ?? "-"}</td>
                        `;

                        tbody.appendChild(tr);

                    });
        })
        .catch(error => {
            console.error("タスク取得エラー", error);
        });

    </script>
</html>
