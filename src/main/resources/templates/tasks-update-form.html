<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク更新</title>
<style>
body {
    min-height: 100%;
    margin: 0;
    font-family: sans-serif;
    background-color: #fcfcf8;
    background-image: 
        radial-gradient(circle, #d8d8d8 0.8px, transparent 1px),
        linear-gradient(to bottom, transparent 13px, #e5e5e5 14px);
    background-size: 14px 14px, 100% 14px;
    background-position: 0 7px, 0 0;
}

main {
    padding: 20px 40px 40px;
    text-align: center;
}

.page-title {
    position: relative;
    display: inline-block;
    font-size: 48px;
    color: #001e43;
    margin: 0 0 32px;
    z-index: 1;
}

.page-title::after {
    content: "";
    position: absolute;
    left: -8px;
    bottom: 8px;
    width: calc(100% + 16px);
    height: 22px;
    background-color: rgba(225, 225, 0, 0.45);
    z-index: -1;
    transform: rotate(-1deg);
}

.task-form {
    width: 560px;
    margin: 0 auto;
    padding: 28px;
    background-color: rgba(225, 225, 225, 0.9);
    border-radius: 10px;
    box-shadow: 4px 6px 10px rgba(0, 0, 0, 0.15);
    text-align: left;
}

.task-form label {
    display: block;
    margin-top: 16px;
    margin-bottom: 8px;
    font-weight: bold;
    color: #001e43;
}

.task-form input,
.task-form textarea,
.task-form select {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 2px solid #c8c8c8;
    border-radius: 6px;
    box-sizing: border-box;
}

.task-form textarea {
    min-height: 120px;
    resize: vertical;
}

.readonly-field {
    background-color: #eeeeee;
    color: #555;
}

.date-select-area {
    display: flex;
    gap: 12px;
}

.error-message {
    color: #d93636;
    font-weight: bold;
    min-height: 24px;
    text-align: center;
}

.button-area {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 32px;
}

.menu-button {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 220px;
    min-height: 50px;
    padding: 12px 20px;
    background-color: #a59aca;
    color: #001e43;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 4px 6px 8px rgba(0, 0, 0, 0.18);
}
</style>
</head>

<body>
<div th:replace="~{header :: header}"></div>

<main>
    <h1 class="page-title">タスク更新</h1>

    <form id="updateForm" class="task-form">

        <label>ID</label>
        <input type="text" id="id" class="readonly-field" readonly>

        <label>ユーザーID</label>
        <input type="text" id="userId" class="readonly-field" readonly>

        <label>タイトル</label>
        <input type="text" id="title">

        <label>学習詳細</label>
        <textarea id="description"></textarea>

        <label>進行度</label>
        <select id="status">
            <option value="未着手">未着手</option>
            <option value="進行中">進行中</option>
            <option value="完了">完了</option>
        </select>

        <label>優先度</label>
        <select id="priority">
            <option value="低">低</option>
            <option value="中">中</option>
            <option value="高">高</option>
        </select>

        <label>期限</label>
        <div class="date-select-area">
            <select id="dueYear">
                <option value="">年</option>
            </select>

            <select id="dueMonth">
                <option value="">月</option>
            </select>

            <select id="dueDay">
                <option value="">日</option>
            </select>
        </div>

        <label>公開/非公開</label>
        <input type="text" id="visibility" class="readonly-field" readonly>

        <label>更新日</label>
        <input type="text" id="update_date" class="readonly-field" readonly>

        <label>作成日</label>
        <input type="text" id="created_at" class="readonly-field" readonly>

        <p id="errorMessage" class="error-message"></p>

        <div class="button-area">
            <button type="submit" class="menu-button">
                確認へ
            </button>

            <a href="#" id="backButton" class="menu-button">
                戻る
            </a>
        </div>
    </form>
</main>
<script>
const selectedTask =
    JSON.parse(sessionStorage.getItem("selectedTask"));

const backPage =
    sessionStorage.getItem("tasksBackPage") || "/tasks-update-form";

if(!selectedTask) {
    alert("選択されたタスクがありません。検索画面に戻ります。");
    window.location.href = "/tasks-search?action=update";
}

const yearSelect = document.getElementById("dueYear");
const monthSelect = document.getElementById("dueMonth");
const daySelect = document.getElementById("dueDay");

const thisYear = new Date().getFullYear();

for (let year = thisYear -1; year <= thisYear +5; year++) {
    yearSelect.innerHTML += `<option value="${year}">${year}</option>`;
}

for (let month = 1; month <= 12; month++) {
    monthSelect.innerHTML += `<option value="${month}">${month}</option>`;
} 

for (let day = 1; day <= 31; day++) {
    daySelect.innerHTML += `<option value="${day}">${day}</option>`;
}

function setDueDate(value) {
    if(!value) {
        return;
    }

    const parts = value.substring(0, 10).split("-");

    yearSelect.value = parts[0];
    monthSelect.value = String(Number(parts[1]));
    daySelect.value = String(Number(parts[2]));
}

function createDueDate() {
    const year = yearSelect.value;
    const month = monthSelect.value.padStart(2, "0");
    const day = daySelect.value.padStart(2, "0");

    if(!year || !monthSelect.value || !daySelect.value) {
        return null;
    }
    return `${year}-${month}-${day}`;
}

document.getElementById("id").value = selectedTask.id ?? "";
document.getElementById("userId").value = selectedTask.userId ?? "";
document.getElementById("title").value = selectedTask.title ?? "";
document.getElementById("description").value = selectedTask.description ?? "";
document.getElementById("status").value = selectedTask.status ?? "未着手";
document.getElementById("priority").value = selectedTask.priority ?? "低";
document.getElementById("visibility").value = formatVisibility(selectedTask.visibility);
document.getElementById("update_date").value = formatDateTime(selectedTask.update_date);
document.getElementById("created_at").value = formatDateTime(selectedTask.created_at);

setDueDate(selectedTask.due_date);

document.getElementById("updateForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const errorMessage = 
            document.getElementById("errorMessage");
        
        errorMessage.textContent = "";

        const title = 
            document.getElementById("title").value.trim();

        const priority =
            document.getElementById("priority").value;
        
        const dueDate =
            createDueDate();
        
        if(!title) {
            errorMessage.textContent = "タイトルは必須です";
            return;
        }

        if(priority === "高" && !dueDate) {
            errorMessage.textContent = "優先度「高」の場合は期限必須です";
            return;
        }

        const updateTaskData = {
            id: selectedTask.id,
            userId: selectedTask.userId,

            title: title,
            description: document.getElementById("description").value,
            status: document.getElementById("status").value,
            priority: priority,
            due_date: dueDate,

            visibility: selectedTask.visibility,
            update_date: selectedTask.update_date,
            created_at: selectedTask.created_at
        };

        console.log("updateTaskData before save:", updateTaskData);

            sessionStorage.setItem(
                "updateTaskData",
            JSON.stringify(updateTaskData)
        );

        if (!sessionStorage.getItem("tasksBackPage")) {

            sessionStorage.setItem(
                "tasksBackPage",
                "/tasks-update-form"
            );
        }

        window.location.href = "/tasks-update-confirm-page";
    });

document.getElementById("backButton")
    .addEventListener("click", function(event) {

        event.preventDefault();

        window.location.href =
            sessionStorage.getItem("tasksBackPage")
            || "/tasks-list";
});

function formatDateTime(value) {
    if (!value) {
        return "-";
    }
    return value.substring(0, 10);
}

function formatVisibility(value) {
    if (value === "PUBLIC") {
        return "公開";
    }

    if (value === "PRIVATE") {
        return "非公開";
    }
    return value ?? "-";
}
</script>
</body>
</html>
