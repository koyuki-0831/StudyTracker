<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク更新確認</title>

<style>
body {
    min-height: 100%;
    margin: 0;
    font-family: sans-serif;
    background-color: #fcfcf8;
    background-image: 
        radial-gradient(circle, #d8d8d8 0.8px, transparent 1px),
        linear-gradient(to bottom, transparent 13px, #e5e5e5 14px);
    background-size: 14px 14px, 100% 14px;
    background-position: 0 7px, 0 0;
}

main {
    padding: 20px 40px 40px;
    text-align: center;
}

.page-title {
    position: relative;
    display: inline-block;
    font-size: 48px;
    color: #001e43;
    margin: 0 0 32px;
    z-index: 1;
}

.page-title::after {
    content: "";
    position: absolute;
    left: -8px;
    bottom: 8px;
    width: calc(100% + 16px);
    height: 22px;
    background-color: rgba(255, 255, 0, 0.45);
    z-index: -1;
    transform: rotate(-1deg);
}

.confirm-card {
    width: 720px;
    margin: 0 auto 28px;
    padding: 28px 36px;
    background-color: rgba(255, 255, 255, 0.92);
    border-radius: 12px;
    box-shadow: 4px 6px 10px rgba(0, 0, 0, 0.15);
    text-align: left;
}

.confirm-row {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 20px;
    padding: 14px 0;
    border-bottom: 1px solid #ddd;
    align-items: start;
}

.confirm-label {
    font-weight: bold;
    color: #001e43;
}

.confirm-value {
    color: #333;
    word-break: break-word;
    white-space: pre-wrap;
}

.error-message {
    color: #d93636;
    font-weight: bold;
    min-height: 24px;
}

.button-area {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 32px;
}

.menu-button {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 220px;
    min-height: 50px;
    padding: 12px 20px;
    background-color: #a59aca;
    color: #001e43;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 4px 6px 8px rgba(0, 0, 0, 0.18);
}
</style>
</head>  
<body>
<div th:replace="~{header :: header}"></div>
<main>
    <h1 class="page-title">更新内容確認</h1>

    <div class="confirm-card">
        <div class="confirm-row">
            <div class="confirm-label">ID:</div>
            <div class="confirm-value" id="confirmId"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">ユーザーID:</div>
            <div class="confirm-value" id="confirmUserId"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">タイトル:</div>
            <div class="confirm-value" id="confirmTitle"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">学習詳細:</div>
            <div class="confirm-value" id="confirmDescription"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">進行度:</div>
            <div class="confirm-value" id="confirmStatus"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">優先度:</div>
            <div class="confirm-value" id="confirmPriority"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">期限:</div>
            <div class="confirm-value" id="confirmDueDate"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">公開/非公開:</div>
            <div class="confirm-value" id="confirmVisibility"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">更新日:</div>
            <div class="confirm-value" id="confirmUpdateDate"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">作成日:</div>
            <div class="confirm-value" id="confirmCreatedAt"></div>
        </div>
    </div>

    <p id="errorMessage" class="error-message"></p>

    <div class="button-area">
        <button type="button" id="updateButton" class="menu-button">
            更新する
        </button>

        <a href="#" id="backButton" class="menu-button">
            戻る
        </a>
    </div>
</main>

<script src="/js/auth-check.js"></script>
<script>
const userId =
    getLoginUserIdOrRedirect();

const updateTaskData = 
    JSON.parse(sessionStorage.getItem("updateTaskData"));

console.log("updateTaskDate:", updateTaskData);

if(!updateTaskData) {
    alert("更新情報がありません。検索画面に戻ります。");
    window.location.href = "/tasks-search?action=update";
}

document.getElementById("confirmId").textContent =
    updateTaskData.id ?? "-";

document.getElementById("confirmUserId").textContent =
    updateTaskData.userId ?? "-";

document.getElementById("confirmTitle").textContent =
    updateTaskData.title ?? "-";

document.getElementById("confirmDescription").textContent =
    updateTaskData.description || "-";

document.getElementById("confirmStatus").textContent =
    updateTaskData.status ?? "-";

document.getElementById("confirmPriority").textContent =
    updateTaskData.priority ?? "-";

document.getElementById("confirmDueDate").textContent =
    updateTaskData.due_date ?? "-";

document.getElementById("confirmVisibility").textContent =
    formatVisibility(updateTaskData.visibility);

document.getElementById("confirmUpdateDate").textContent =
    formatDateTime(updateTaskData.update_date);

document.getElementById("confirmCreatedAt").textContent =
    formatDateTime(updateTaskData.created_at);

document.getElementById("backButton")
    .addEventListener("click", function(event) {

        event.preventDefault();

        window.location.href =
            "/tasks-update-form";
});

document.getElementById("updateButton")
    .addEventListener("click", function() {

        fetch(`/tasks/${encodeURIComponent(userId)}/${updateTaskData.id}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: updateTaskData.title,
                description: updateTaskData.description,
                status: updateTaskData.status,
                priority: updateTaskData.priority,
                due_date: updateTaskData.due_date,
                visibility: updateTaskData.visibility
            })
        })
        .then(async response => {
            if(!response.ok) {
                const errorData =
                    await response.json();

            throw new Error(
                errorData.message || "更新に失敗しました"
                    );
            }
            return response.json();
        })
        .then(date => {
            sessionStorage.removeItem("updateTaskData");
            sessionStorage.removeItem("selectedTask");

            alert("更新しました");

            window.location.href = "/tasks-page";
        })
        .catch(error => {
            document.getElementById("errorMessage").textContent =
                error.message;
            
            console.error(error);
        });
    });

function formatDateTime(value) {
    if(!value) {
        return "-";
    }

    return value.substring(0, 10)
}

function formatVisibility(value) {
    if(value === "PUBLIC") {
        return "公開";
    }

    if(value === "PRIVATE") {
        return "非公開";
    }

    return value ?? "-";
}
</script>
</body>  
</html>
