<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>学習記録更新確認</title>

<style>
body {
    min-height: 100%;
    margin: 0;
    font-family: sans-serif;
    background-color: #fcfcf8;
    background-image:
        radial-gradient(circle, #d8d8d8 0.8px, transparent 1px),
        linear-gradient(to bottom, transparent 13px, #e5e5e5 14px);
    background-size: 14px 14px, 100% 14px;
    background-position: 0 7px, 0 0;
}

main {
    padding: 20px 40px 40px;
    text-align: center;
}

.page-title {
    position: relative;
    display: inline-block;
    font-size: 48px;
    color: #001e43;
    margin: 0 0 32px;
    z-index: 1;
}

.page-title::after {
    content: "";
    position: absolute;
    left: -8px;
    bottom: 8px;
    width: calc(100% + 16px);
    height: 22px;
    background-color: rgba(255,255,0,0.45);
    z-index: -1;
    transform: rotate(-1deg);
}

.confirm-card {
    width: 760px;
    margin: 0 auto;
    padding: 32px;
    background-color: rgba(220, 211, 251, 0.95);
    border-radius: 12px;
    box-shadow: 4px 6px 10px rgba(0,0,0,0.15);
    text-align: left;
}

.section-title {
    font-size: 22px;
    font-weight: bold;
    color: #001e43;
    margin: 24px 0 14px;
    border-bottom: 2px solid #a59aca;
    padding-bottom: 8px;
}

.confirm-row {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 20px;
    padding: 12px 0;
    border-bottom: 1px solid #ddd;
}

.confirm-label {
    font-weight: bold;
    color: #001e43;
}

.confirm-value {
    color: #333;
    white-space: pre-wrap;
    word-break: break-word;
}

.error-message {
    color: #d93636;
    font-weight: bold;
    text-align: center;
    min-height: 24px;
}

.button-area {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 32px;
}

.menu-button {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 220px;
    min-height: 50px;
    padding: 12px 20px;
    background-color: #a59aca;
    color: #001e43;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 4px 6px 8px rgba(0,0,0,0.18);
}

.update-button {
    background-color: #f4b6b6;
}
</style>
</head>

<body>
<div th:replace="~{header :: header}"></div>

<main>
    <h1 class="page-title">学習記録更新確認</h1>

    <div class="confirm-card">

        <p class="section-title">タスク情報</p>

        <div class="confirm-row">
            <div class="confirm-label">学習記録ID:</div>
            <div class="confirm-value" id="confirmId"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">タスクID:</div>
            <div class="confirm-value" id="confirmTaskId"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">ユーザーID:</div>
            <div class="confirm-value" id="confirmUserId"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">タイトル:</div>
            <div class="confirm-value" id="confirmTaskTitle"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">タスク詳細:</div>
            <div class="confirm-value" id="confirmDescription"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">優先度:</div>
            <div class="confirm-value" id="confirmPriority"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">期限:</div>
            <div class="confirm-value" id="confirmDueDate"></div>
        </div>

        <p class="section-title">更新内容</p>

        <div class="confirm-row">
            <div class="confirm-label">学習詳細:</div>
            <div class="confirm-value" id="confirmStudyMethod"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">進行度:</div>
            <div class="confirm-value" id="confirmStatus"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">発生した問題:</div>
            <div class="confirm-value" id="confirmIssue"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">原因:</div>
            <div class="confirm-value" id="confirmCause"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">解決方法:</div>
            <div class="confirm-value" id="confirmSolution"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">メモ:</div>
            <div class="confirm-value" id="confirmMemo"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">理解度:</div>
            <div class="confirm-value" id="confirmComprehensionLevel"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">学習時間:</div>
            <div class="confirm-value" id="confirmDurationMinutes"></div>
        </div>

    </div>

    <p id="errorMessage" class="error-message"></p>

    <div class="button-area">
        <button type="button" id="updateButton" class="menu-button update-button">
            更新
        </button>

        <a th:href="@{/studylogs-update-form}" class="menu-button">
            戻る
        </a>
    </div>
</main>

<script>
const updateData =
    JSON.parse(sessionStorage.getItem("studyLogUpdateData"));

if (!updateData) {
    alert("更新内容がありません。更新画面へ戻ります。");
    window.location.href = "/studylogs-search?action=update";
}

document.getElementById("confirmId").textContent =
    updateData.id ?? "-";

document.getElementById("confirmTaskId").textContent =
    updateData.taskId ?? "-";

document.getElementById("confirmUserId").textContent =
    updateData.userId ?? "-";

document.getElementById("confirmTaskTitle").textContent =
    updateData.taskTitle ?? "-";

document.getElementById("confirmDescription").textContent =
    updateData.description || "-";

document.getElementById("confirmPriority").textContent =
    updateData.priority ?? "-";

document.getElementById("confirmDueDate").textContent =
    formatDate(updateData.dueDate ?? updateData.due_date);

document.getElementById("confirmStudyMethod").textContent =
    updateData.studyMethod || "-";

document.getElementById("confirmStatus").textContent =
    updateData.status ?? "-";

document.getElementById("confirmIssue").textContent =
    updateData.issue || "-";

document.getElementById("confirmCause").textContent =
    updateData.cause || "-";

document.getElementById("confirmSolution").textContent =
    updateData.solution || "-";

document.getElementById("confirmMemo").textContent =
    updateData.memo || "-";

document.getElementById("confirmComprehensionLevel").textContent =
    formatComprehension(updateData.comprehensionLevel);

document.getElementById("confirmDurationMinutes").textContent =
    formatMinutes(updateData.durationMinutes);

document.getElementById("updateButton")
    .addEventListener("click", function() {

        const errorMessage =
            document.getElementById("errorMessage");

        errorMessage.textContent = "";

        const requestBody = {
            studyMethod: updateData.studyMethod,
            status: updateData.status,
            issue: updateData.issue,
            cause: updateData.cause,
            solution: updateData.solution,
            memo: updateData.memo,
            comprehensionLevel: Number(updateData.comprehensionLevel),
            durationMinutes: Number(updateData.durationMinutes)
        };

        console.log("requestBody:", requestBody);
        console.log("url:", `/studylogs/${updateData.userId}/${updateData.id}`);

        fetch(`/studylogs/${updateData.userId}/${updateData.id}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(requestBody)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error("学習記録の更新に失敗しました");
            }

            return response.json();
        })
        .then(data => {
            alert("学習記録を更新しました");

            sessionStorage.removeItem("studyLogUpdateData");
            sessionStorage.removeItem("selectedStudyLog");

            window.location.href = "/studylogs-page";
        })
        .catch(error => {
            errorMessage.textContent =
                error.message;

            console.error(error);
        });
    });

function formatDate(value) {
    if (!value) {
        return "-";
    }

    return String(value).substring(0, 10);
}

function formatMinutes(value) {
    if (!value && value !== 0) {
        return "-";
    }

    return `${value}分`;
}

function formatComprehension(value) {
    const level =
        Number(value);

    if (!level) {
        return "-";
    }

    return "★".repeat(level) + "☆".repeat(5 - level);
}
</script>

</body>
</html>
