<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>アカウント登録確認</title>

<style>
body {
    min-height: 100%;
    margin: 0;
    font-family: sans-serif;
    background-color: #fcfcf8;
    background-image:
        radial-gradient(circle, #d8d8d8 0.8px, transparent 1px),
        linear-gradient(to bottom, transparent 13px, #e5e5e5 14px);
    background-size: 14px 14px, 100% 14px;
    background-position: 0 7px, 0 0;
}

main {
    padding: 20px 40px 40px;
    text-align: center;
}

.page-title {
    position: relative;
    display: inline-block;
    font-size: 48px;
    color: #001e43;
    margin: 0 0 32px;
    z-index: 1;
}

.page-title::after {
    content: "";
    position: absolute;
    left: -8px;
    bottom: 8px;
    width: calc(100% + 16px);
    height: 22px;
    background-color: rgba(255, 255, 0, 0.45);
    z-index: -1;
    transform: rotate(-1deg);
}

.confirm-card {
    width: 620px;
    margin: 0 auto;
    padding: 32px;
    background-color: rgba(220, 211, 251, 0.95);
    border-radius: 12px;
    box-shadow: 4px 6px 10px rgba(0, 0, 0, 0.15);
    text-align: left;
}

.confirm-row {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 20px;
    padding: 14px 0;
    border-bottom: 1px solid #ddd;
}

.confirm-label {
    font-weight: bold;
    color: #001e43;
}

.confirm-value {
    color: #333;
    word-break: break-word;
}

.error-message {
    color: #d93636;
    font-weight: bold;
    min-height: 24px;
    text-align: center;
}

.button-area {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 32px;
}

.menu-button {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 220px;
    min-height: 50px;
    padding: 12px 20px;
    background-color: #a59aca;
    color: #001e43;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 4px 6px 8px rgba(0, 0, 0, 0.18);
}
</style>
</head>

<body>
<div th:replace="~{header :: header}"></div>

<main>
    <h1 class="page-title">アカウント登録確認</h1>

    <div class="confirm-card">
        <div class="confirm-row">
            <div class="confirm-label">ユーザーID:</div>
            <div class="confirm-value" id="confirmUserId"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">ユーザー名:</div>
            <div class="confirm-value" id="confirmUsername"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">メールアドレス:</div>
            <div class="confirm-value" id="confirmEmail"></div>
        </div>

        <div class="confirm-row">
            <div class="confirm-label">パスワード:</div>
            <div class="confirm-value">********</div>
        </div>

        <p id="errorMessage" class="error-message"></p>
    </div>

    <div class="button-area">
        <button type="button" id="registerButton" class="menu-button">
            登録する
        </button>

        <a href="#" id="backButton" class="menu-button">
            戻る
        </a>
    </div>
</main>

<script>
const registerData =
    JSON.parse(sessionStorage.getItem("registerData"));

if (!registerData) {
    alert("登録情報がありません。登録画面に戻ります。");
    window.location.href = "/register";
}

document.getElementById("confirmUserId").textContent =
    registerData.userId ?? "-";

document.getElementById("confirmUsername").textContent =
    registerData.username ?? "-";

document.getElementById("confirmEmail").textContent =
    registerData.email ?? "-";

document.getElementById("backButton")
    .addEventListener("click", function(event) {
        event.preventDefault();

        window.location.href = "/register";
    });

document.getElementById("registerButton")
    .addEventListener("click", async function() {

        const errorMessage =
            document.getElementById("errorMessage");

        errorMessage.textContent = "";

        try {
            const response = await fetch("/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    userId: registerData.userId,
                    username: registerData.username,
                    email: registerData.email,
                    password: registerData.password
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message);
            }

            sessionStorage.removeItem("registerData");

            alert("アカウント登録が完了しました。ログインしてください。");

            window.location.href = "/login";

        } catch(error) {

            let message = error.message;
            if(message.includes("パスワードは6文字以上")) {
                message = "パスワードは6文字以上で入力してください";
            }

            if(message.includes("メールアドレス")) {
                message = "メールアドレスの形式を確認してください";
            }

            document.getElementById("errorMessage")
                .textContent = message;
        }
    });
</script>

</body>
</html>
