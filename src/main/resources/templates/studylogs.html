<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学習記録管理</title>
</head>
<style>

    body {
		min-height: 100%;
        margin: 0;
        font-family: sans-serif;

        background-color: #fcfcf8;

        background-image: 

            /* ドット */
			radial-gradient(
				circle,
			   	#d8d8d8 0.8px,
			 	transparent 1px
			),

            /* 横罫線 */
            linear-gradient(
                to bottom,
                transparent 13px,
                #e5e5e5 14px
            );

            
        /* ドット間隔 / 行間 */
        background-size: 
            14px 14px,
            100% 14px;

        background-position: 
            0 7px,
            0 0;

        transition: transform 0.5s ease, opacity 0.5s ease;
        transform-origin: left center;
    }

    body.page-turn {
        transform: rotateY(-12deg);
        opacity: 0;
    }

    main {
        padding: 20px 40px 40px;
        text-align: center;
    }

    .page-title {
        position: relative;
        display: inline-block;

        font-size: 48px;
        color: #001e43;

        margin-bottom: 50px;

        margin: 0 0 24px;

        z-index: 1;
    }

    .page-title::after {
        content: "";

        position: absolute;

        left: -8px;
        bottom: 8px;

        width: calc(100% + 16px);
        height: 22px;

        background-color: rgba(255, 255, 0, 0.45);

        z-index: -1;

        transform: rotate(-1deg);

    }

    .button-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
    }
    

    .menu-button {
        display: flex;
        justify-content: center;
        align-items: center;

        width: 240px ;
        min-height: 50px ;
        padding: 16px 20px ;
        margin: 20px;

        background-color: #a59aca;
        color: #001e43;

        font-size: 22px;
        font-weight: bold;

        text-decoration: none;
        text-align: center;

        border-radius: 4px;
        box-shadow: 
            4px 6px 8px rgba(0, 0, 0, 0.18);

        transform: rotate(-2deg);

        position: relative;
        overflow: hidden;
    }

    .menu-button:hover {
        transform: rotate(0deg) translateY(-6px);
        box-shadow: 
            6px 10px 14px rgba(0, 0, 0, 0.22);
    }

    .menu-button::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;

        width: 28px;
        height: 28px;

        background: linear-gradient(
            135deg,
            rgba(0, 0, 0, 0.12),
            rgba(255, 255, 255, 0.5)
        );
    }

</style>
<body>
    <div th:replace="~{header :: header}"></div>
    <main>
        <h1 class="page-title">学習記録</h1>

        <div class="button-area">
            <a th:href="@{/studylogs-list}" class="menu-button">
                学習記録一覧
            </a>
            <a th:href="@{/studylogs-search(action='regist')}" class="menu-button">
                学習記録登録
            </a>
            <a th:href="@{/studylogs-search(action='update')}" class="menu-button">
                学習記録更新
            </a>
            <a th:href="@{/studylogs-search(action='delete')}" class="menu-button">
                学習記録削除
            </a>


            <a th:href="@{/}" class="menu-button">戻る</a>
        </div>
    </main>
</body>
<script>
    document.querySelectorAll(".menu-button").forEach(button => {
        button.addEventListener("click", function(event) {
            event.preventDefault();

            const url = this.getAttribute("href");

            document.body.classList.add("page-turn");

            setTimeout(() => {
                window.location.href = url;
            }, 500);
        });
    });
</script>
</html>
