<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>学習記録詳細</title>

<style>
body {
    min-height: 100%;
    margin: 0;
    font-family: sans-serif;
    background-color: #fcfcf8;
    background-image:
        radial-gradient(circle, #d8d8d8 0.8px, transparent 1px),
        linear-gradient(to bottom, transparent 13px, #e5e5e5 14px);
    background-size: 14px 14px, 100% 14px;
    background-position: 0 7px, 0 0;
}

main {
    padding: 20px 40px 40px;
    text-align: center;
}

.page-title {
    position: relative;
    display: inline-block;
    font-size: 48px;
    color: #001e43;
    margin: 0 0 32px;
    z-index: 1;
}

.page-title::after {
    content: "";
    position: absolute;
    left: -8px;
    bottom: 8px;
    width: calc(100% + 16px);
    height: 22px;
    background-color: rgba(255,255,0,0.45);
    z-index: -1;
    transform: rotate(-1deg);
}

.detail-card {
    width: 780px;
    margin: 0 auto;
    padding: 32px;
    background-color: rgba(220, 211, 251, 0.95);
    border-radius: 12px;
    box-shadow: 4px 6px 10px rgba(0,0,0,0.15);
    text-align: left;
}

.section-title {
    font-size: 22px;
    font-weight: bold;
    color: #001e43;
    margin: 24px 0 14px;
    border-bottom: 2px solid #a59aca;
    padding-bottom: 8px;
}

.section-title:first-child {
    margin-top: 0;
}

.detail-row {
    display: grid;
    grid-template-columns: 190px 1fr;
    gap: 20px;
    padding: 12px 0;
    border-bottom: 1px solid #ddd;
}

.detail-label {
    font-weight: bold;
    color: #001e43;
}

.detail-value {
    color: #333;
    white-space: pre-wrap;
    word-break: break-word;
}

.button-area {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 32px;
}

.menu-button {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 220px;
    min-height: 50px;
    padding: 12px 20px;
    background-color: #a59aca;
    color: #001e43;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 4px 6px 8px rgba(0,0,0,0.18);
}

</style>
</head>

<body>
<div th:replace="~{header :: header}"></div>

<main>
    <h1 class="page-title">学習記録詳細</h1>

    <div class="detail-card">

        <p class="section-title">基本情報</p>

        <div class="detail-row">
            <div class="detail-label">学習記録ID:</div>
            <div class="detail-value" id="detailId"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">ユーザーID:</div>
            <div class="detail-value" id="detailUserId"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">タスクID:</div>
            <div class="detail-value" id="detailTaskId"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">タイトル:</div>
            <div class="detail-value" id="detailTaskTitle"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">タスク詳細:</div>
            <div class="detail-value" id="detailDescription"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">優先度:</div>
            <div class="detail-value" id="detailPriority"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">期限:</div>
            <div class="detail-value" id="detailDueDate"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">公開/非公開:</div>
            <div class="detail-value" id="detailVisibility"></div>
        </div>

        <p class="section-title">学習記録</p>

        <div class="detail-row">
            <div class="detail-label">学習詳細:</div>
            <div class="detail-value" id="detailStudyMethod"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">進行度:</div>
            <div class="detail-value" id="detailStatus"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">発生した問題:</div>
            <div class="detail-value" id="detailIssue"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">原因:</div>
            <div class="detail-value" id="detailCause"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">解決方法:</div>
            <div class="detail-value" id="detailSolution"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">メモ:</div>
            <div class="detail-value" id="detailMemo"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">理解度:</div>
            <div class="detail-value" id="detailComprehensionLevel"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">学習時間:</div>
            <div class="detail-value" id="detailDurationMinutes"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">合計学習時間:</div>
            <div class="detail-value" id="detailTotalTime"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">学習完了日:</div>
            <div class="detail-value" id="detailFinishDate"></div>
        </div>

        <p class="section-title">管理情報</p>

        <div class="detail-row">
            <div class="detail-label">作成日:</div>
            <div class="detail-value" id="detailCreatedAt"></div>
        </div>

        <div class="detail-row">
            <div class="detail-label">更新日:</div>
            <div class="detail-value" id="detailUpdateDate"></div>
        </div>

    </div>

    <div class="button-area">
        <a href="#" id="backButton" class="menu-button">
            戻る
        </a>
    </div>
</main>

<script>
const detailData =
    JSON.parse(sessionStorage.getItem("selectedStudyLog"));

if (!detailData) {
    alert("詳細表示する学習記録がありません。");
    window.location.href = "/studylogs-list";
}

document.getElementById("detailId").textContent =
    detailData.id ?? "-";

document.getElementById("detailUserId").textContent =
    detailData.userId ?? "-";

document.getElementById("detailTaskId").textContent =
    detailData.taskId ?? "-";

document.getElementById("detailTaskTitle").textContent =
    detailData.taskTitle ?? "-";

document.getElementById("detailDescription").textContent =
    detailData.description || "-";

document.getElementById("detailPriority").textContent =
    detailData.priority ?? "-";

document.getElementById("detailDueDate").textContent =
    formatDate(detailData.due_date ?? detailData.dueDate);

document.getElementById("detailVisibility").textContent =
    formatVisibility(detailData.visibility);

document.getElementById("detailStudyMethod").textContent =
    detailData.studyMethod || "-";

document.getElementById("detailStatus").textContent =
    detailData.status ?? "-";

document.getElementById("detailIssue").textContent =
    detailData.issue || "-";

document.getElementById("detailCause").textContent =
    detailData.cause || "-";

document.getElementById("detailSolution").textContent =
    detailData.solution || "-";

document.getElementById("detailMemo").textContent =
    detailData.memo || "-";

document.getElementById("detailComprehensionLevel").textContent =
    detailData.understandingLabel
        ?? formatComprehension(detailData.comprehensionLevel);

document.getElementById("detailDurationMinutes").textContent =
    detailData.durationLabel
        ?? formatMinutes(detailData.durationMinutes);

document.getElementById("detailTotalTime").textContent =
    detailData.totalTimeLabel ?? "-";

document.getElementById("detailFinishDate").textContent =
    formatDate(detailData.finishDate ?? detailData.finish_date);

document.getElementById("detailCreatedAt").textContent =
    formatDateTime(detailData.created_at ?? detailData.createdAt);

document.getElementById("detailUpdateDate").textContent =
    formatDateTime(detailData.update_date ?? detailData.updateDate);



document.getElementById("backButton")
    .addEventListener("click", function(event) {
        event.preventDefault();

        const backPage =
            sessionStorage.getItem("studyLogsBackPage")
                || "/studylogs-list";

        window.location.href = backPage;
    });

function formatDate(value) {
    if (!value) {
        return "-";
    }

    return String(value).substring(0, 10);
}

function formatDateTime(value) {
    if (!value) {
        return "-";
    }

    return String(value).replace("T", " ").substring(0, 16);
}

function formatMinutes(value) {
    if (!value && value !== 0) {
        return "-";
    }

    return `${value}分`;
}

function formatComprehension(value) {
    const level = Number(value);

    if (!level) {
        return "-";
    }

    return "★".repeat(level)
        + "☆".repeat(5 - level);
}

function formatVisibility(value) {
    if (value === "PUBLIC") {
        return "公開";
    }

    if (value === "PRIVATE") {
        return "非公開";
    }

    return value ?? "-";
}
</script>

</body>
</html>
